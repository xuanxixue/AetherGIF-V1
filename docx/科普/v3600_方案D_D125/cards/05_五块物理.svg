<rect width="1920" height="1080" fill="url(#c05_vig)"/>
<g style="mix-blend-mode:screen;opacity:.85"><rect class="anim-sheen" x="0" y="0" width="430" height="1080" fill="url(#c05_sheen)"/></g>
<g fill="none" stroke="#C084FC" stroke-width="2" opacity="0.28">
