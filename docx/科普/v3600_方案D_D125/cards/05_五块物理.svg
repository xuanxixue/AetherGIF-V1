<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img">

<defs>
  <linearGradient id="c05_bg" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0%" stop-color="#04060D"/>
    <stop offset="52%" stop-color="#0A0F1E"/>
    <stop offset="100%" stop-color="#070B16"/>
  </linearGradient>
  <radialGradient id="c05_a1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#C084FC" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c05_a2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#C084FC" stop-opacity="0.24"/>
    <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c05_a3" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c05_vig" cx="0.5" cy="0.48" r="0.74">
    <stop offset="52%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.82"/>
  </radialGradient>
  <linearGradient id="c05_sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="48%" stop-color="#fff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="c05_accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C084FC"/>
    <stop offset="100%" stop-color="#C084FC"/>
  </linearGradient>
  <linearGradient id="c05_fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C084FC" stop-opacity="0"/>
    <stop offset="50%" stop-color="#C084FC" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
  </linearGradient>
  <filter id="c05_soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="92"/>
  </filter>
  <filter id="c05_soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>
  <filter id="c05_glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c05_glows" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="2.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c05_titleglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c05_grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
  </filter>
  <pattern id="c05_dot" width="46" height="46" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#5B6884" opacity="0.30"/>
  </pattern>
  <pattern id="c05_fine" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M10 0H0V10" fill="none" stroke="#C084FC" stroke-width="0.5" opacity="0.11"/>
  </pattern>
  <marker id="c05_ar" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.5"
          markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#C084FC"/>
  </marker>
</defs>

<style>
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,60px) scale(1.14)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-110px,40px) scale(0.94)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-80px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
@keyframes pulseSoft{0%,100%{opacity:.18}50%{opacity:.62}}
@keyframes scanline{0%{transform:translateY(-320px)}100%{transform:translateY(1300px)}}
@keyframes dashflow{to{stroke-dashoffset:-440}}
@keyframes floatUp{0%{transform:translate(0,0);opacity:0}
 14%{opacity:var(--op,.5)}82%{opacity:var(--op,.5)}100%{transform:translate(var(--dx,20px),-190px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1.3)}}
@keyframes gridScroll{to{transform:translateY(64px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 5px var(--gc,#2DD4F0))}
 50%{filter:drop-shadow(0 0 24px var(--gc,#2DD4F0))}}
@keyframes sheenMove{0%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes slideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.86)}68%{transform:scale(1.035)}100%{opacity:1;transform:scale(1)}}
@keyframes ringSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg) scale(1)}}
@keyframes dashdraw{from{stroke-dashoffset:var(--len,1000)}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
@keyframes converge{0%{transform:translate(0,0) scale(1);opacity:.35}
 100%{transform:translate(var(--tx,0),var(--ty,0)) scale(.28);opacity:1}}
@keyframes orbit{from{transform:rotate(0) translateX(var(--rad,180px)) rotate(0)}
 to{transform:rotate(360deg) translateX(var(--rad,180px)) rotate(-360deg)}}
@keyframes waveUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.22}100%{opacity:1}}

text{font-family:'Inter','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,ui-monospace,monospace}
.anim-rise{animation:slideIn .95s cubic-bezier(.2,.8,.2,1) both}
.anim-riseL{animation:slideL .95s cubic-bezier(.2,.8,.2,1) both}
.anim-pop{animation:popIn .8s cubic-bezier(.2,.9,.25,1) both}
.anim-breathe{animation:breathe 5.2s ease-in-out infinite}
.anim-spin{animation:spinSlow 28s linear infinite;transform-box:fill-box;transform-origin:center}
.anim-spinr{animation:spinRev 36s linear infinite;transform-box:fill-box;transform-origin:center}
.anim-spin-c{animation:spinSlow 22s linear infinite;transform-origin:center}
.anim-glow{animation:glowPulse 3.6s ease-in-out infinite}
.anim-d1{animation:drift1 19s ease-in-out infinite}
.anim-d2{animation:drift2 23s ease-in-out infinite}
.anim-d3{animation:drift3 17s ease-in-out infinite}
.anim-scan{animation:scanline 9.5s linear infinite}
.anim-sheen{animation:sheenMove 12s ease-in-out infinite}
.anim-float{animation:floatUp linear infinite}
.anim-twinkle{animation:twinkle 3.8s ease-in-out infinite}
.anim-growx{animation:growX 1.6s cubic-bezier(.2,.8,.2,1) both}
.anim-draw{animation:dashdraw 2.3s ease-out both}
.anim-converge{animation:converge 3.4s cubic-bezier(.2,.8,.2,1) both}
.anim-orbit{animation:orbit var(--dur,14s) linear infinite;transform-box:fill-box;transform-origin:center}
.anim-wave{animation:waveUp var(--dur,3.4s) ease-in-out infinite}
.anim-blink{animation:blink 2.4s steps(1) infinite}
.anim-dash{animation:dashflow 2.4s linear infinite}
</style>
<rect width="1920" height="1080" fill="url(#c05_bg)"/>
<g filter="url(#c05_soft)" style="mix-blend-mode:screen"><ellipse class="anim-d1" cx="300" cy="200" rx="560" ry="400" fill="url(#c05_a1)"/><ellipse class="anim-d2" cx="1720" cy="900" rx="430" ry="330" fill="url(#c05_a2)"/><ellipse class="anim-d3" cx="1120" cy="90" rx="360" ry="270" fill="url(#c05_a3)"/></g>
<rect width="1920" height="1080" fill="url(#c05_dot)" opacity="0.5"/>
<rect width="1920" height="1080" fill="url(#c05_fine)" opacity="0.5"/>
<rect x="0" y="0" width="1920" height="2" fill="url(#c05_accent)" opacity="0.85"/>
<text x="104" y="132" font-size="22" font-weight="700" letter-spacing="7" fill="#C084FC">THE FIVE PHYSICS PARTS</text>
<rect x="104" y="152" width="86" height="4" rx="2" fill="#C084FC"/>
<text x="104" y="204" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#EDF3FF">五块物理，替掉整条 Transformer 栈</text>
<text x="104" y="254" font-size="27" fill="#9DABC8">整个模型里唯一的稠密投影，是驻波层的 W₁/W₂ 和四个文本条件头。剩下的全是物理。</text>
<text x="1816" y="128" text-anchor="end" font-size="19" font-weight="600" letter-spacing="3" fill="#5B6884">AETHERGIF v3600</text>
<text x="1816" y="204" text-anchor="end" font-size="52" font-weight="800" fill="#5B6884">05<tspan fill="#22304E"> / 18</tspan></text>
<g class="anim-riseL" style="animation-delay:0.0s">
<rect x="150" y="350" width="1620" height="104" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="350" width="5" height="104" rx="2.5" fill="#2DD4F0"/>
<text x="190" y="394" font-size="26" font-weight="800" fill="#2DD4F0" class="mono">01</text>
<text x="252" y="392" font-size="24" font-weight="800" fill="#EDF3FF" class="mono">KuramotoSync</text>
<text x="252" y="426" font-size="19" font-weight="700" fill="#2DD4F0">相位同步</text>
<rect x="600" y="372" width="620" height="60" rx="10" fill="#060A14" opacity="0.85"/>
<text x="620" y="410" font-size="19" font-weight="500" fill="#9DABC8" class="mono">dθ/dt = ω + ΣW·sin(θⱼ−θᵢ) + κ·g + η</text>
<text x="1260" y="410" font-size="18" font-weight="500" fill="#5B6884">替掉 self-attention：谁跟谁耦合，由物理权重决定</text>
</g>
<g class="anim-riseL" style="animation-delay:0.12s">
<rect x="150" y="466" width="1620" height="104" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="466" width="5" height="104" rx="2.5" fill="#C084FC"/>
<text x="190" y="510" font-size="26" font-weight="800" fill="#C084FC" class="mono">02</text>
<text x="252" y="508" font-size="24" font-weight="800" fill="#EDF3FF" class="mono">StandingWaveFFN</text>
<text x="252" y="542" font-size="19" font-weight="700" fill="#C084FC">共振混合</text>
<rect x="600" y="488" width="620" height="60" rx="10" fill="#060A14" opacity="0.85"/>
<text x="620" y="526" font-size="19" font-weight="500" fill="#9DABC8" class="mono">h = W₂(GELU(W₁z) ⊙ A(ω_d,ω_n) ⊙ SW(p))</text>
<text x="1260" y="526" font-size="18" font-weight="500" fill="#5B6884">替掉 FFN：通道混合由洛伦兹共振曲线决定</text>
</g>
<g class="anim-riseL" style="animation-delay:0.24s">
<rect x="150" y="582" width="1620" height="104" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="582" width="5" height="104" rx="2.5" fill="#FBBF24"/>
<text x="190" y="626" font-size="26" font-weight="800" fill="#FBBF24" class="mono">03</text>
<text x="252" y="624" font-size="24" font-weight="800" fill="#EDF3FF" class="mono">DriftField</text>
<text x="252" y="658" font-size="19" font-weight="700" fill="#FBBF24">目标吸引</text>
<rect x="600" y="604" width="620" height="60" rx="10" fill="#060A14" opacity="0.85"/>
<text x="620" y="642" font-size="19" font-weight="500" fill="#9DABC8" class="mono">gᵢ = Σ softmax(−‖ẑᵢ−ẑⱼ‖²/τ)·sin(θⱼᵗᵃʳ−θᵢ)</text>
<text x="1260" y="642" font-size="18" font-weight="500" fill="#5B6884">唯一的目标信息通道：让相位朝目标相位收敛</text>
</g>
<g class="anim-riseL" style="animation-delay:0.36s">
<rect x="150" y="698" width="1620" height="104" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="698" width="5" height="104" rx="2.5" fill="#34D399"/>
<text x="190" y="742" font-size="26" font-weight="800" fill="#34D399" class="mono">04</text>
<text x="252" y="740" font-size="24" font-weight="800" fill="#EDF3FF" class="mono">OU 振幅</text>
<text x="252" y="774" font-size="19" font-weight="700" fill="#34D399">恢复力</text>
<rect x="600" y="720" width="620" height="60" rx="10" fill="#060A14" opacity="0.85"/>
<text x="620" y="758" font-size="19" font-weight="500" fill="#9DABC8" class="mono">log a ← log a + res − γ(log a − μ)</text>
<text x="1260" y="758" font-size="18" font-weight="500" fill="#5B6884">替掉 LayerNorm：log 域乘性更新 + 布朗恢复力</text>
</g>
<g class="anim-riseL" style="animation-delay:0.48s">
<rect x="150" y="814" width="1620" height="104" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="814" width="5" height="104" rx="2.5" fill="#FB7185"/>
<text x="190" y="858" font-size="26" font-weight="800" fill="#FB7185" class="mono">05</text>
<text x="252" y="856" font-size="24" font-weight="800" fill="#EDF3FF" class="mono">TimeField</text>
<text x="252" y="890" font-size="19" font-weight="700" fill="#FB7185">时间课程</text>
<rect x="600" y="836" width="620" height="60" rx="10" fill="#060A14" opacity="0.85"/>
<text x="620" y="874" font-size="19" font-weight="500" fill="#9DABC8" class="mono">κ(t) 课程 · T(t) 退火 · ω_d(t) 扫频</text>
<text x="1260" y="874" font-size="18" font-weight="500" fill="#5B6884">替掉堆层深度：12 层 = 一条从混乱到锁定的物理时间线</text>
</g>
<g class="anim-rise" style="animation-delay:.75s">
<rect x="150" y="946" width="1620" height="60" rx="14" fill="#0C1424" opacity="0.7" stroke="#FBBF24" stroke-width="1.2"/>
<text x="186" y="984" font-size="20" font-weight="600" fill="#FBBF24">另外：帧数 TS=6 · 时间窗 WIN=5 · 空间块 32×32 · 采样 30 帧 @10fps = 3 秒</text>
</g>
