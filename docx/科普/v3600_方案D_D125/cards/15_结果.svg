<text x="104" y="204" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#EDF3FF">数字说话</text>
<text x="104" y="254" font-size="27" fill="#9DABC8">2,500 步之后，加权相位余弦 0.9991，频谱轮廓余弦 0.9967。物理通路走得通。</text>
<text x="1816" y="128" text-anchor="end" font-size="19" font-weight="600" letter-spacing="3" fill="#5B6884">AETHERGIF v3600</text>
<text x="1816" y="204" text-anchor="end" font-size="52" font-weight="800" fill="#5B6884">15<tspan fill="#22304E"> / 18</tspan></text>
<g class="anim-rise" style="animation-delay:0.1s">
<rect x="150" y="350" width="378" height="210" rx="20" fill="#090F1D" opacity="0.85" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="350" width="3" height="210" rx="1.5" fill="#2DD4F0"/>
<text x="178" y="382" font-size="17" font-weight="700" fill="#2DD4F0" letter-spacing="2.2">功率加权相位余弦</text>
<text x="178" y="428.4" font-size="58" font-weight="800" fill="#EDF3FF" class="mono">0.9991</text>
<text x="178" y="462.4" font-size="18" font-weight="500" fill="#5B6884">1.0 = 完全对齐</text>
</g>
