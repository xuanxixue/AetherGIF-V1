<text x="1402" y="382" font-size="17" font-weight="700" fill="#34D399" letter-spacing="2.2">对编解码天花板 PSNR</text>
<text x="1402" y="428.4" font-size="58" font-weight="800" fill="#EDF3FF" class="mono">19.84 dB</text>
<text x="1402" y="462.4" font-size="18" font-weight="500" fill="#5B6884">2500 步</text>
</g>
