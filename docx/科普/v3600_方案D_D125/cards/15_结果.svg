<text x="1580" y="758" font-size="18" font-weight="800" fill="#FBBF24" class="mono">1.48</text>
<text x="1116" y="796" font-size="17" font-weight="600" fill="#9DABC8">中高</text>
<rect x="1210" y="783" width="340" height="15" rx="7" fill="#101A2C"/>
<rect class="bg2" x="1210" y="783" width="309" height="15" rx="7" fill="#FBBF24" style="transform-origin:1210px 791px;animation-delay:0.64s"/>
<text x="1580" y="796" font-size="18" font-weight="800" fill="#FBBF24" class="mono">2.18</text>
<text x="1116" y="834" font-size="17" font-weight="600" fill="#9DABC8">高频</text>
<rect x="1210" y="821" width="340" height="15" rx="7" fill="#101A2C"/>
<rect class="bg2" x="1210" y="821" width="242" height="15" rx="7" fill="#FBBF24" style="transform-origin:1210px 829px;animation-delay:0.72s"/>
<text x="1580" y="834" font-size="18" font-weight="800" fill="#FBBF24" class="mono">1.71</text>
<text x="1116" y="878" font-size="15" font-weight="500" fill="#5B6884">全部高于 1.0，因为水平项 μ 仍有偏——这正是 §5.4 记录的 log 与 log1p 域不一致。</text>
<g class="anim-rise" style="animation-delay:.7s">
<rect x="150" y="872" width="900" height="48" rx="12" fill="#120C12" opacity="0.7" stroke="#FB7185" stroke-width="1.2"/>
<text x="178" y="903" font-size="17" font-weight="700" fill="#FB7185">注意：未加权平均相位余弦从 0.9933 微降到 0.9885 —— 这是好事</text>
</g>
<g class="anim-rise" style="animation-delay:.78s">
<text x="1075" y="903" font-size="15" font-weight="500" fill="#5B6884">因为模型在抬高弱系数的振幅，它们的噪声相位进入了平均。</text>
</g>
