<text x="390" y="606" font-size="16" font-weight="500" fill="#5B6884">训练片段不同，像素 PSNR 不可直接比</text>
<text x="660" y="606" font-size="17" font-weight="700" fill="#5B6884" class="mono">v2500</text>
<text x="900" y="606" font-size="17" font-weight="700" fill="#FBBF24" class="mono">v3600</text>
