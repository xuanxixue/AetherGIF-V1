<text x="1116" y="720" font-size="17" font-weight="600" fill="#9DABC8">低频</text>
<rect x="1210" y="707" width="340" height="15" rx="7" fill="#101A2C"/>
<rect class="bg2" x="1210" y="707" width="160" height="15" rx="7" fill="#2DD4F0" style="transform-origin:1210px 715px;animation-delay:0.48s"/>
<text x="1580" y="720" font-size="18" font-weight="800" fill="#2DD4F0" class="mono">1.13</text>
