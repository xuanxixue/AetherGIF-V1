<text x="586" y="428.4" font-size="58" font-weight="800" fill="#EDF3FF" class="mono">0.9967</text>
<text x="586" y="462.4" font-size="18" font-weight="500" fill="#5B6884">0 = 频谱被压平</text>
</g>
