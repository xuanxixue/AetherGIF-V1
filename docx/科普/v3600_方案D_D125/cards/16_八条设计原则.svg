<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img">

<defs>
  <linearGradient id="c16_bg" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0%" stop-color="#04060D"/>
    <stop offset="52%" stop-color="#0A0F1E"/>
    <stop offset="100%" stop-color="#070B16"/>
  </linearGradient>
  <radialGradient id="c16_a1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#2DD4F0" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#2DD4F0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c16_a2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#C084FC" stop-opacity="0.24"/>
    <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c16_a3" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c16_vig" cx="0.5" cy="0.48" r="0.74">
    <stop offset="52%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.82"/>
  </radialGradient>
  <linearGradient id="c16_sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="48%" stop-color="#fff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="c16_accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2DD4F0"/>
    <stop offset="100%" stop-color="#C084FC"/>
  </linearGradient>
  <linearGradient id="c16_fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#2DD4F0" stop-opacity="0"/>
    <stop offset="50%" stop-color="#2DD4F0" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#2DD4F0" stop-opacity="0"/>
  </linearGradient>
  <filter id="c16_soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="92"/>
  </filter>
  <filter id="c16_soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>
  <filter id="c16_glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c16_glows" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="2.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c16_titleglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c16_grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
  </filter>
  <pattern id="c16_dot" width="46" height="46" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#5B6884" opacity="0.30"/>
  </pattern>
  <pattern id="c16_fine" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M10 0H0V10" fill="none" stroke="#2DD4F0" stroke-width="0.5" opacity="0.11"/>
  </pattern>
  <marker id="c16_ar" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.5"
          markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#2DD4F0"/>
  </marker>
</defs>

<style>
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,60px) scale(1.14)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-110px,40px) scale(0.94)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-80px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
@keyframes pulseSoft{0%,100%{opacity:.18}50%{opacity:.62}}
@keyframes scanline{0%{transform:translateY(-320px)}100%{transform:translateY(1300px)}}
@keyframes dashflow{to{stroke-dashoffset:-440}}
@keyframes floatUp{0%{transform:translate(0,0);opacity:0}
 14%{opacity:var(--op,.5)}82%{opacity:var(--op,.5)}100%{transform:translate(var(--dx,20px),-190px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1.3)}}
@keyframes gridScroll{to{transform:translateY(64px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 5px var(--gc,#2DD4F0))}
 50%{filter:drop-shadow(0 0 24px var(--gc,#2DD4F0))}}
@keyframes sheenMove{0%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes slideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.86)}68%{transform:scale(1.035)}100%{opacity:1;transform:scale(1)}}
@keyframes ringSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg) scale(1)}}
@keyframes dashdraw{from{stroke-dashoffset:var(--len,1000)}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
@keyframes converge{0%{transform:translate(0,0) scale(1);opacity:.35}
 100%{transform:translate(var(--tx,0),var(--ty,0)) scale(.28);opacity:1}}
@keyframes orbit{from{transform:rotate(0) translateX(var(--rad,180px)) rotate(0)}
 to{transform:rotate(360deg) translateX(var(--rad,180px)) rotate(-360deg)}}
@keyframes waveUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.22}100%{opacity:1}}

text{font-family:'Inter','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,ui-monospace,monospace}
.anim-rise{animation:slideIn .95s cubic-bezier(.2,.8,.2,1) both}
.anim-riseL{animation:slideL .95s cubic-bezier(.2,.8,.2,1) both}
.anim-pop{animation:popIn .8s cubic-bezier(.2,.9,.25,1) both}
.anim-breathe{animation:breathe 5.2s ease-in-out infinite}
.anim-spin{animation:spinSlow 28s linear infinite;transform-box:fill-box;transform-origin:center}
.anim-spinr{animation:spinRev 36s linear infinite;transform-box:fill-box;transform-origin:center}
.anim-spin-c{animation:spinSlow 22s linear infinite;transform-origin:center}
.anim-glow{animation:glowPulse 3.6s ease-in-out infinite}
.anim-d1{animation:drift1 19s ease-in-out infinite}
.anim-d2{animation:drift2 23s ease-in-out infinite}
.anim-d3{animation:drift3 17s ease-in-out infinite}
.anim-scan{animation:scanline 9.5s linear infinite}
.anim-sheen{animation:sheenMove 12s ease-in-out infinite}
.anim-float{animation:floatUp linear infinite}
.anim-twinkle{animation:twinkle 3.8s ease-in-out infinite}
.anim-growx{animation:growX 1.6s cubic-bezier(.2,.8,.2,1) both}
.anim-draw{animation:dashdraw 2.3s ease-out both}
.anim-converge{animation:converge 3.4s cubic-bezier(.2,.8,.2,1) both}
.anim-orbit{animation:orbit var(--dur,14s) linear infinite;transform-box:fill-box;transform-origin:center}
.anim-wave{animation:waveUp var(--dur,3.4s) ease-in-out infinite}
.anim-blink{animation:blink 2.4s steps(1) infinite}
.anim-dash{animation:dashflow 2.4s linear infinite}
</style>
<rect width="1920" height="1080" fill="url(#c16_bg)"/>
<g filter="url(#c16_soft)" style="mix-blend-mode:screen"><ellipse class="anim-d1" cx="300" cy="200" rx="560" ry="400" fill="url(#c16_a1)"/><ellipse class="anim-d2" cx="1720" cy="900" rx="430" ry="330" fill="url(#c16_a2)"/><ellipse class="anim-d3" cx="1120" cy="90" rx="360" ry="270" fill="url(#c16_a3)"/></g>
<rect width="1920" height="1080" fill="url(#c16_dot)" opacity="0.5"/>
<rect width="1920" height="1080" fill="url(#c16_fine)" opacity="0.5"/>
<rect x="0" y="0" width="1920" height="2" fill="url(#c16_accent)" opacity="0.85"/>
<text x="104" y="132" font-size="22" font-weight="700" letter-spacing="7" fill="#2DD4F0">DESIGN PRINCIPLES</text>
<rect x="104" y="152" width="86" height="4" rx="2" fill="#2DD4F0"/>
<text x="104" y="204" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#EDF3FF">八条承重结论</text>
<text x="104" y="254" font-size="27" fill="#9DABC8">每一条都由一个被记录在案的失败模式换来。这是 AetherGIF 这条线最有价值的部分。</text>
<text x="1816" y="128" text-anchor="end" font-size="19" font-weight="600" letter-spacing="3" fill="#5B6884">AETHERGIF v3600</text>
<text x="1816" y="204" text-anchor="end" font-size="52" font-weight="800" fill="#5B6884">16<tspan fill="#22304E"> / 18</tspan></text>
<g class="anim-rise" style="animation-delay:0.00s">
<rect x="150" y="350" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="350" width="4" height="132" rx="2" fill="#2DD4F0"/>
<circle cx="198" cy="394" r="22" fill="#2DD4F0" opacity="0.16" stroke="#2DD4F0" stroke-width="1.4"/><text x="198" y="400" text-anchor="middle" font-size="17" font-weight="800" fill="#2DD4F0">01</text>
<text x="238" y="402" font-size="22" font-weight="800" fill="#EDF3FF">ω 必须确定性</text>
<text x="180" y="446" font-size="16" font-weight="500" fill="#9DABC8">每次前向重采样本征频率 = 每步换掉整个动力系统，什么都学不到。</text>
</g>
<g class="anim-rise" style="animation-delay:0.08s">
<rect x="980" y="350" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="980" y="350" width="4" height="132" rx="2" fill="#FBBF24"/>
<circle cx="1028" cy="394" r="22" fill="#FBBF24" opacity="0.16" stroke="#FBBF24" stroke-width="1.4"/><text x="1028" y="400" text-anchor="middle" font-size="17" font-weight="800" fill="#FBBF24">02</text>
<text x="1068" y="402" font-size="22" font-weight="800" fill="#EDF3FF">漂移场是唯一目标通道</text>
<text x="1010" y="446" font-size="16" font-weight="500" fill="#9DABC8">噪声初值 + 确定性 ω 之下，目标信息只能靠吸引子进入相位演化。</text>
</g>
<g class="anim-rise" style="animation-delay:0.16s">
<rect x="150" y="502" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="502" width="4" height="132" rx="2" fill="#34D399"/>
<circle cx="198" cy="546" r="22" fill="#34D399" opacity="0.16" stroke="#34D399" stroke-width="1.4"/><text x="198" y="552" text-anchor="middle" font-size="17" font-weight="800" fill="#34D399">03</text>
<text x="238" y="554" font-size="22" font-weight="800" fill="#EDF3FF">振幅在 log 域乘性演化</text>
<text x="180" y="598" font-size="16" font-weight="500" fill="#9DABC8">加性更新会锁死动态范围，把重尾频谱压平。</text>
</g>
<g class="anim-rise" style="animation-delay:0.24s">
<rect x="980" y="502" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="980" y="502" width="4" height="132" rx="2" fill="#C084FC"/>
<circle cx="1028" cy="546" r="22" fill="#C084FC" opacity="0.16" stroke="#C084FC" stroke-width="1.4"/><text x="1028" y="552" text-anchor="middle" font-size="17" font-weight="800" fill="#C084FC">04</text>
<text x="1068" y="554" font-size="22" font-weight="800" fill="#EDF3FF">相位链永不折叠</text>
<text x="1010" y="598" font-size="16" font-weight="500" fill="#9DABC8">折叠只属于损失；边界处梯度为零，会静默掐断 12 层的信用分配。</text>
</g>
<g class="anim-rise" style="animation-delay:0.32s">
<rect x="150" y="654" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="654" width="4" height="132" rx="2" fill="#2DD4F0"/>
<circle cx="198" cy="698" r="22" fill="#2DD4F0" opacity="0.16" stroke="#2DD4F0" stroke-width="1.4"/><text x="198" y="704" text-anchor="middle" font-size="17" font-weight="800" fill="#2DD4F0">05</text>
<text x="238" y="706" font-size="22" font-weight="800" fill="#EDF3FF">相位按功率加权，振幅按 log 软化</text>
<text x="180" y="750" font-size="16" font-weight="500" fill="#9DABC8">大多数 FFT 系数是数值噪声，无权重监督就是在拟合噪声。</text>
</g>
<g class="anim-rise" style="animation-delay:0.40s">
<rect x="980" y="654" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="980" y="654" width="4" height="132" rx="2" fill="#FBBF24"/>
<circle cx="1028" cy="698" r="22" fill="#FBBF24" opacity="0.16" stroke="#FBBF24" stroke-width="1.4"/><text x="1028" y="704" text-anchor="middle" font-size="17" font-weight="800" fill="#FBBF24">06</text>
<text x="1068" y="706" font-size="22" font-weight="800" fill="#EDF3FF">深度就是物理时间</text>
<text x="1010" y="750" font-size="16" font-weight="500" fill="#9DABC8">耦合课程 + 温度退火 + 频率扫频，让 12 层成为一条热力学叙事。</text>
</g>
<g class="anim-rise" style="animation-delay:0.48s">
<rect x="150" y="806" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="806" width="4" height="132" rx="2" fill="#FB7185"/>
<circle cx="198" cy="850" r="22" fill="#FB7185" opacity="0.16" stroke="#FB7185" stroke-width="1.4"/><text x="198" y="856" text-anchor="middle" font-size="17" font-weight="800" fill="#FB7185">07</text>
<text x="238" y="858" font-size="22" font-weight="800" fill="#EDF3FF">编解码器是架构的一部分</text>
<text x="180" y="902" font-size="16" font-weight="500" fill="#9DABC8">一行 spec[:, :D] 截断支配了所有下游视觉指标。</text>
</g>
<g class="anim-rise" style="animation-delay:0.56s">
<rect x="980" y="806" width="790" height="132" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<rect x="980" y="806" width="4" height="132" rx="2" fill="#34D399"/>
<circle cx="1028" cy="850" r="22" fill="#34D399" opacity="0.16" stroke="#34D399" stroke-width="1.4"/><text x="1028" y="856" text-anchor="middle" font-size="17" font-weight="800" fill="#34D399">08</text>
<text x="1068" y="858" font-size="22" font-weight="800" fill="#EDF3FF">均值指标会骗人</text>
<text x="1010" y="902" font-size="16" font-weight="500" fill="#9DABC8">验收必须看空间域统计，且以原始源为下限，绝不拿过度锐化的旧权重当基准。</text>
</g>
<rect width="1920" height="1080" filter="url(#c16_grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
<rect width="1920" height="1080" fill="url(#c16_vig)"/>
<g style="mix-blend-mode:screen;opacity:.85"><rect class="anim-sheen" x="0" y="0" width="430" height="1080" fill="url(#c16_sheen)"/></g>
<g fill="none" stroke="#2DD4F0" stroke-width="2" opacity="0.28">
<path d="M46 104 L46 46 L104 46"/>
<path d="M1874 104 L1874 46 L1816 46"/>
<path d="M46 976 L46 1034 L104 1034"/>
<path d="M1874 976 L1874 1034 L1816 1034"/>
</g>
<rect x="104" y="984" width="1712" height="1" fill="#18223A"/>
<rect x="104" y="984" width="1522" height="2" fill="#2DD4F0" opacity="0.75"/>
<text x="104" y="1022" font-size="18" fill="#5B6884">AetherGIF v3600 · 方案 D · D=125 全谱编解码</text>
<text x="1816" y="1022" text-anchor="end" font-size="18" fill="#5B6884" class="mono">v3600_方案D_D125 / TECHNICAL_REPORT</text>
</svg>