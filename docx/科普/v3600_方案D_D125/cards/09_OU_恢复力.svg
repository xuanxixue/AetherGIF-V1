<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img">

<defs>
  <linearGradient id="c09_bg" x1="0" y1="0" x2="0.75" y2="1">
    <stop offset="0%" stop-color="#04060D"/>
    <stop offset="52%" stop-color="#0A0F1E"/>
    <stop offset="100%" stop-color="#070B16"/>
  </linearGradient>
  <radialGradient id="c09_a1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#34D399" stop-opacity="0.40"/>
    <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c09_a2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#C084FC" stop-opacity="0.24"/>
    <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c09_a3" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.16"/>
    <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="c09_vig" cx="0.5" cy="0.48" r="0.74">
    <stop offset="52%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.82"/>
  </radialGradient>
  <linearGradient id="c09_sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="48%" stop-color="#fff" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="c09_accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#34D399"/>
    <stop offset="100%" stop-color="#C084FC"/>
  </linearGradient>
  <linearGradient id="c09_fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#34D399" stop-opacity="0"/>
    <stop offset="50%" stop-color="#34D399" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
  </linearGradient>
  <filter id="c09_soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="92"/>
  </filter>
  <filter id="c09_soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="36"/>
  </filter>
  <filter id="c09_glow" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c09_glows" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="2.8" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c09_titleglow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="3.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="c09_grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
  </filter>
  <pattern id="c09_dot" width="46" height="46" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.1" fill="#5B6884" opacity="0.30"/>
  </pattern>
  <pattern id="c09_fine" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M10 0H0V10" fill="none" stroke="#34D399" stroke-width="0.5" opacity="0.11"/>
  </pattern>
  <marker id="c09_ar" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.5"
          markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#34D399"/>
  </marker>
</defs>

<style>
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(90px,60px) scale(1.14)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-110px,40px) scale(0.94)}}
@keyframes drift3{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-80px)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes spinRev{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.07)}}
@keyframes pulseSoft{0%,100%{opacity:.18}50%{opacity:.62}}
@keyframes scanline{0%{transform:translateY(-320px)}100%{transform:translateY(1300px)}}
@keyframes dashflow{to{stroke-dashoffset:-440}}
@keyframes floatUp{0%{transform:translate(0,0);opacity:0}
 14%{opacity:var(--op,.5)}82%{opacity:var(--op,.5)}100%{transform:translate(var(--dx,20px),-190px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.55)}50%{opacity:1;transform:scale(1.3)}}
@keyframes gridScroll{to{transform:translateY(64px)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 5px var(--gc,#2DD4F0))}
 50%{filter:drop-shadow(0 0 24px var(--gc,#2DD4F0))}}
@keyframes sheenMove{0%{transform:translateX(-160%) skewX(-18deg)}100%{transform:translateX(360%) skewX(-18deg)}}
@keyframes slideIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideL{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:translateX(0)}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popIn{0%{opacity:0;transform:scale(.86)}68%{transform:scale(1.035)}100%{opacity:1;transform:scale(1)}}
@keyframes ringSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.05)}100%{transform:rotate(360deg) scale(1)}}
@keyframes dashdraw{from{stroke-dashoffset:var(--len,1000)}to{stroke-dashoffset:0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1}}
@keyframes converge{0%{transform:translate(0,0) scale(1);opacity:.35}
 100%{transform:translate(var(--tx,0),var(--ty,0)) scale(.28);opacity:1}}
@keyframes orbit{from{transform:rotate(0) translateX(var(--rad,180px)) rotate(0)}
 to{transform:rotate(360deg) translateX(var(--rad,180px)) rotate(-360deg)}}
@keyframes waveUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.22}100%{opacity:1}}

text{font-family:'Inter','HarmonyOS Sans SC','PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif}
.mono{font-family:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,ui-monospace,monospace}
.anim-rise{animation:slideIn .95s cubic-bezier(.2,.8,.2,1) both}
.anim-riseL{animation:slideL .95s cubic-bezier(.2,.8,.2,1) both}
.anim-pop{animation:popIn .8s cubic-bezier(.2,.9,.25,1) both}
.anim-breathe{animation:breathe 5.2s ease-in-out infinite}
.anim-spin{animation:spinSlow 28s linear infinite;transform-box:fill-box;transform-origin:center}
.anim-spinr{animation:spinRev 36s linear infinite;transform-box:fill-box;transform-origin:center}
.anim-spin-c{animation:spinSlow 22s linear infinite;transform-origin:center}
.anim-glow{animation:glowPulse 3.6s ease-in-out infinite}
.anim-d1{animation:drift1 19s ease-in-out infinite}
.anim-d2{animation:drift2 23s ease-in-out infinite}
.anim-d3{animation:drift3 17s ease-in-out infinite}
.anim-scan{animation:scanline 9.5s linear infinite}
.anim-sheen{animation:sheenMove 12s ease-in-out infinite}
.anim-float{animation:floatUp linear infinite}
.anim-twinkle{animation:twinkle 3.8s ease-in-out infinite}
.anim-growx{animation:growX 1.6s cubic-bezier(.2,.8,.2,1) both}
.anim-draw{animation:dashdraw 2.3s ease-out both}
.anim-converge{animation:converge 3.4s cubic-bezier(.2,.8,.2,1) both}
.anim-orbit{animation:orbit var(--dur,14s) linear infinite;transform-box:fill-box;transform-origin:center}
.anim-wave{animation:waveUp var(--dur,3.4s) ease-in-out infinite}
.anim-blink{animation:blink 2.4s steps(1) infinite}
.anim-dash{animation:dashflow 2.4s linear infinite}

@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.gy{animation:growUp 1.8s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}
@keyframes oscPulse{0%,100%{opacity:.5}50%{opacity:1}}
.op{animation:oscPulse 2.2s ease-in-out infinite}
</style>
<rect width="1920" height="1080" fill="url(#c09_bg)"/>
<g filter="url(#c09_soft)" style="mix-blend-mode:screen"><ellipse class="anim-d1" cx="300" cy="200" rx="560" ry="400" fill="url(#c09_a1)"/><ellipse class="anim-d2" cx="1720" cy="900" rx="430" ry="330" fill="url(#c09_a2)"/><ellipse class="anim-d3" cx="1120" cy="90" rx="360" ry="270" fill="url(#c09_a3)"/></g>
<rect width="1920" height="1080" fill="url(#c09_dot)" opacity="0.5"/>
<rect width="1920" height="1080" fill="url(#c09_fine)" opacity="0.5"/>
<rect x="0" y="0" width="1920" height="2" fill="url(#c09_accent)" opacity="0.85"/>
<text x="104" y="132" font-size="22" font-weight="700" letter-spacing="7" fill="#34D399">PHYSICS 04 · OU RESTORING FORCE</text>
<rect x="104" y="152" width="86" height="4" rx="2" fill="#34D399"/>
<text x="104" y="204" font-size="78" font-weight="800" letter-spacing="-1.5" fill="#EDF3FF">振幅在 log 域上乘性演化</text>
<text x="104" y="254" font-size="27" fill="#9DABC8">FFT 振幅横跨几个数量级，加性更新会锁死动态范围、把重尾频谱压平。log 域 + 恢复力才是正解</text>
<text x="104" y="294" font-size="27" fill="#9DABC8">。</text>
<text x="1816" y="128" text-anchor="end" font-size="19" font-weight="600" letter-spacing="3" fill="#5B6884">AETHERGIF v3600</text>
<text x="1816" y="204" text-anchor="end" font-size="52" font-weight="800" fill="#5B6884">09<tspan fill="#22304E"> / 18</tspan></text>
<rect x="150" y="350" width="800" height="260" rx="18" fill="#070C17" opacity="0.85" stroke="#22304E" stroke-width="1.2"/>
<rect x="150" y="350" width="4" height="260" rx="2" fill="#34D399" opacity="0.9"/>
<text x="176" y="386" font-size="17" font-weight="700" fill="#5B6884" letter-spacing="2.4">PLAN D 振幅递推（log 域）</text>
<text x="176" y="428" font-size="20" class="mono" fill="#9DABC8">res       = 2·tanh(log_res / 2)        # 每层残差有界</text>
<text x="176" y="468" font-size="20" class="mono" fill="#9DABC8">log a_new = log a + res − γ·(log a − μ)</text>
<text x="176" y="508" font-size="20" class="mono" fill="#9DABC8">log a_new = clamp(log a_new, −20, 5)</text>
<text x="176" y="548" font-size="20" class="mono" fill="#9DABC8">a_new     = exp(log a_new)</text>
<g class="anim-rise" style="animation-delay:.2s">
<rect x="150" y="640" width="800" height="130" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<text x="178" y="682" font-size="21" font-weight="800" fill="#34D399">为什么必须乘性？</text>
<text x="178" y="716" font-size="18" font-weight="500" fill="#9DABC8">纯累加下振幅 12 层会爆到目标的 100×。而 −γ(log a − μ) 是布朗运动加恢复力，</text>
<text x="178" y="746" font-size="18" font-weight="500" fill="#9DABC8">其 Fokker–Planck 平稳分布有界——这是经典的稳定化机制。</text>
</g>
<g class="anim-rise" style="animation-delay:.34s">
<rect x="150" y="790" width="800" height="120" rx="16" fill="#0A0E1B" opacity="0.7" stroke="#22304E" stroke-width="1.2"/>
<text x="178" y="830" font-size="20" font-weight="800" fill="#FBBF24">为什么用 log1p 之外的 log 域？</text>
<text x="178" y="864" font-size="17" font-weight="500" fill="#9DABC8">log 域乘性更新让梯度在对数尺度上均匀，各通道都能被有效监督。</text>
</g>
<rect x="1000" y="350" width="770" height="300" rx="20" fill="#0A0E1B" opacity="0.72" stroke="#22304E" stroke-width="1.2"/>
<text x="1030" y="394" font-size="21" font-weight="800" fill="#FBBF24">通道振幅的量纲差异有多大？</text>
<rect class="gy" x="1040.0" y="470.0" width="48.5" height="130.0" rx="4" fill="#FBBF24" opacity="0.90" style="animation-delay:0.10s"/>
<rect class="gy" x="1097.5" y="509.7" width="48.5" height="90.3" rx="4" fill="#FB7185" opacity="0.85" style="animation-delay:0.17s"/>
<rect class="gy" x="1155.0" y="533.9" width="48.5" height="66.1" rx="4" fill="#FB7185" opacity="0.81" style="animation-delay:0.24s"/>
<rect class="gy" x="1212.5" y="547.6" width="48.5" height="52.4" rx="4" fill="#34D399" opacity="0.77" style="animation-delay:0.31s"/>
<rect class="gy" x="1270.0" y="556.2" width="48.5" height="43.8" rx="4" fill="#34D399" opacity="0.72" style="animation-delay:0.38s"/>
<rect class="gy" x="1327.5" y="563.1" width="48.5" height="36.9" rx="4" fill="#34D399" opacity="0.68" style="animation-delay:0.45s"/>
<rect class="gy" x="1385.0" y="567.8" width="48.5" height="32.2" rx="4" fill="#34D399" opacity="0.63" style="animation-delay:0.52s"/>
<rect class="gy" x="1442.5" y="571.0" width="48.5" height="29.0" rx="4" fill="#34D399" opacity="0.58" style="animation-delay:0.59s"/>
<rect class="gy" x="1500.0" y="574.3" width="48.5" height="25.7" rx="4" fill="#34D399" opacity="0.54" style="animation-delay:0.66s"/>
<rect class="gy" x="1557.5" y="577.1" width="48.5" height="22.9" rx="4" fill="#34D399" opacity="0.50" style="animation-delay:0.73s"/>
<rect class="gy" x="1615.0" y="579.7" width="48.5" height="20.3" rx="4" fill="#34D399" opacity="0.45" style="animation-delay:0.80s"/>
<rect class="gy" x="1672.5" y="582.0" width="48.5" height="18.0" rx="4" fill="#34D399" opacity="0.41" style="animation-delay:0.87s"/>
<line x1="1040" y1="600" x2="1730" y2="600" stroke="#22304E" stroke-width="1.4"/>
<text x="1040" y="630" font-size="15" font-weight="600" fill="#5B6884" class="mono">0.0247（中频）</text>
<text x="1730" y="630" font-size="15" font-weight="700" fill="#FBBF24" text-anchor="end" class="mono">7.84（DC）</text>
<text x="1030" y="632" font-size="16" font-weight="500" fill="#5B6884">各通道均值最大差 727× · std/mean ≈ 5.75 · 重尾到 p99≈5.4 / 中位数 0.0015</text>
<g class="anim-rise" style="animation-delay:.4s">
<rect x="1000" y="672" width="770" height="238" rx="20" fill="#120C10" opacity="0.72" stroke="#FB7185" stroke-width="1.2"/>
<rect x="1000" y="672" width="770" height="3" rx="1.5" fill="#FB7185" opacity="0.9"/>
<text x="1030" y="716" font-size="20" font-weight="800" fill="#FB7185">方案 D 的已知弱点（文档如实记录）</text>
<text x="1030" y="754" font-size="17" font-weight="500" fill="#9DABC8">一个 γ 同时管两件事：水平收敛到 μ，以及形状衰减。</text>
<text x="1030" y="786" font-size="17" font-weight="500" fill="#9DABC8">当 γ 自训到 ≈0.04，初始水平的 61% 撑过 12 层，μ 压不住它。</text>
<text x="1030" y="822" font-size="17" font-weight="600" fill="#FBBF24">另外：架构在 log 域递推，损失却在 log1p 域聚合，两者从第一步就分岔</text>
<text x="1030" y="852" font-size="17" font-weight="600" fill="#FBBF24">（实测差 ≈3.05 个单位）——这就是 μ 一直振荡而不收敛的原因。</text>
<text x="1030" y="890" font-size="16" font-weight="500" fill="#5B6884">v3600 保留原状以维持基线保真度；后续版本把 γ 拆成 γ_level / γ_shape。</text>
</g>
